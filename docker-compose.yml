version: '3.8'

services:
  # 1. Redis Message Broker, Event Bus & Distributed Cache
  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. PostgreSQL 16 Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: clinic_postgres
    environment:
      POSTGRES_USER: clinic_admin
      POSTGRES_PASSWORD: clinic_secure_password
      POSTGRES_DB: clinic_master
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/qlphongkham.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U clinic_admin -d clinic_master" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. NestJS API Gateway (REST, Swagger, JWT Guard, Redis ClientProxy)
  api-gateway:
    build:
      context: ./backend-nestjs
      dockerfile: Dockerfile
    container_name: clinic_api_gateway
    command: [ "npm", "run", "start:prod:api-gateway" ]
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=clinic_admin
      - DB_PASSWORD=clinic_secure_password
      - DB_NAME=clinic_master
      - JWT_SECRET=clinic_jwt_super_secret_key_change_in_prod
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # 4. Auth & Account Microservice
  auth-service:
    build:
      context: ./backend-nestjs
      dockerfile: Dockerfile
    container_name: clinic_auth_service
    command: [ "npm", "run", "start:prod:auth-service" ]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=clinic_admin
      - DB_PASSWORD=clinic_secure_password
      - DB_NAME=clinic_master
      - JWT_SECRET=clinic_jwt_super_secret_key_change_in_prod
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # 5. Patient Microservice
  patient-service:
