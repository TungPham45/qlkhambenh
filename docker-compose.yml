      context: ./backend-nestjs
      dockerfile: Dockerfile
    container_name: clinic_patient_service
    command: [ "npm", "run", "start:prod:patient-service" ]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=clinic_admin
      - DB_PASSWORD=clinic_secure_password
      - DB_NAME=clinic_master
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # 6. Staff Microservice
  staff-service:
