  # 13. React Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinic_frontend
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - api-gateway

volumes:
  redis_data:
  postgres_data:
